name: Bug report
description: Something in werft does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: werft version
      description: The tag in the site's package.json, e.g. v0.5.0.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where it runs (Cloudflare Pages, werft serve, werft dev, PHP web space), the Node version, and the browser for problems in the editor.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps that show the problem. Leave out passwords, tokens and personal data.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead, with error messages or log output.
    validations:
      required: true
