# release-please keeps a release pull request open from the Conventional Commits on main: the next
# version in package.json, package-lock.json and README.md, and CHANGELOG.md. Merging it tags
# vX.Y.Z and creates the GitHub Release. Sites install werft from the tag; nothing else is published.
# It signs in as a GitHub App, because a pull request opened with GITHUB_TOKEN gets no gate run.
# Until the variable RELEASE_APP_CLIENT_ID is set, the job is skipped.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
